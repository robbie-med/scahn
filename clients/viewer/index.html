<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="viewer.title">Scahn — Viewer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- A thin strip across the very top. layout() in main.js reserves its
           height, so both viewports start below it and it can never cover the
           image. It stays until the anatomy is clinically validated. -->
      <div id="prealpha" class="disclaimer">
        <b data-i18n="viewer.prealphaBold">Pre-alpha — not clinically validated.</b>
        <span data-i18n="viewer.prealphaBody">The anatomy is real but window positions are
        untested approximations. Not for clinical instruction.</span>
      </div>

      <canvas id="stage"></canvas>

      <!-- Sector mask + graticule for the 2D panel. Positioned over the right
           viewport; paints everything OUTSIDE the beam sector opaque so the
           panel reads as an ultrasound screen, not a rectangle of geometry. -->
      <svg id="panel-overlay" aria-hidden="true"></svg>

      <!-- All the top chrome lives in the 3D viewport (wide) or in a strip
           above the panels (narrow); layout() sizes and places it. -->
      <div id="topbar">
        <div class="row">
          <div id="window-name" class="badge">No window</div>
          <div id="mode-name" class="badge">Mode 1 — Ray</div>
          <div id="frozen-badge" class="badge frozen hidden" data-i18n="viewer.frozen">FROZEN</div>
          <button id="about-btn" type="button" data-i18n-title="viewer.aboutTitle">i</button>
        </div>
        <div class="chips tools">
          <button id="freeze-btn" type="button" aria-pressed="false" data-i18n="viewer.freeze">Freeze</button>
          <button id="caliper-btn" type="button" aria-pressed="false" data-i18n="viewer.caliper">Caliper</button>
          <button id="caliper-clear" type="button" data-i18n="viewer.clearCalipers">Clear</button>
          <button id="save-btn" type="button" data-i18n="viewer.saveImage">Save image</button>
          <button id="learn-btn" type="button" data-i18n="viewer.learn">Learn</button>
        </div>
        <div id="model-picker">
          <div id="model-chips" class="chips"></div>
          <div class="chips">
            <button id="muscle-toggle" type="button" aria-pressed="false"
                    data-i18n-title="viewer.musclesTitle" data-i18n="viewer.muscles">Muscles</button>
            <span class="chip-label" data-i18n="viewer.engine">Engine</span>
            <div id="engine-chips" class="chips"></div>
          </div>
        </div>
        <div id="model-status" class="model-status"></div>
      </div>

      <button id="about-close-dummy" type="button" hidden></button>
      <div id="about" class="hidden" role="dialog" aria-modal="true" aria-label="About Scahn">
        <div class="about-card">
          <button id="about-close" type="button" aria-label="Close">&times;</button>
          <div id="about-body"></div>
        </div>
      </div>

      <aside id="pairing">
        <div class="pair-head">
          <h1>Scahn</h1>
          <div id="code" class="code">------</div>
          <button id="show-qr" type="button" data-i18n="viewer.showQr" aria-pressed="false">QR</button>
        </div>
        <div class="pair-body">
          <div id="lang-toggle" class="chips lang"></div>
          <p class="lede" data-i18n="viewer.scanQr">Scan this with your phone's camera app.</p>
          <div id="qr"></div>
          <p class="hint" id="pair-hint"><span data-i18n="viewer.orOpen">Or open</span>
            <b id="pair-url">…</b> <span data-i18n="viewer.andType">and type the code.</span></p>
        </div>
        <div id="roster"></div>
      </aside>

      <!-- Tutorial drawer: an iframe beside the panels (ROADMAP A4). layout()
           shrinks the viewports while it is open, so it never covers the image. -->
      <aside id="learn" class="hidden">
        <div class="learn-bar">
          <span id="learn-title"></span>
          <a id="learn-tab" href="#" target="_blank" rel="noopener noreferrer" data-i18n="viewer.openTab">Open in new tab</a>
          <button id="learn-close" type="button" data-i18n="viewer.close">Close</button>
        </div>
        <iframe id="learn-frame" title="Tutorial" sandbox="allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer" loading="lazy"></iframe>
      </aside>

      <details id="debug">
        <summary data-i18n="viewer.debug">Debug</summary>
        <div class="row"><label><span data-i18n="viewer.smoothing">Smoothing</span> <input id="smooth" type="range" min="0.02" max="1" step="0.01" value="0.25" /></label><span id="smooth-val">0.25</span></div>
        <div class="row"><label><span data-i18n="viewer.moveGain">Move gain</span> <input id="move-gain" type="range" min="0.25" max="4" step="0.05" value="1" /></label><span id="move-gain-val">1.00</span></div>
        <div class="row"><label><input id="invert-clip" type="checkbox" /> <span data-i18n="viewer.invertClip">Invert clip side</span></label></div>
        <div class="row"><label><input id="show-beam" type="checkbox" checked /> <span data-i18n="viewer.beamSector">Beam sector</span></label></div>
        <div class="row"><label><input id="show-fiducials" type="checkbox" /> <span data-i18n="viewer.fiducials">Fiducials</span></label></div>
        <div class="row"><label><input id="save-panel-only" type="checkbox" /> <span data-i18n="viewer.panelOnly">Save panel only</span></label></div>
        <dl id="stats"></dl>
      </details>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
